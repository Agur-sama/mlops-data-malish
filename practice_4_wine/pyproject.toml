[tool.poetry]
name = "mlops-wine-practice-4"
version = "1.0.0"
description = "Практика 4: MLflow experiments and ClearML model registration"
authors = ["Maksim Malysh"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
clearml = "1.16.5"
joblib = "1.4.2"
mlflow = "2.19.0"
numpy = "2.1.3"
pandas = "2.2.3"
scikit-learn = "1.5.2"
scipy = "1.14.1"

[tool.poetry.group.test.dependencies]
pytest = "8.3.4"
ruff = "0.9.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[build-system]
requires = ["poetry-core==2.1.1"]
build-backend = "poetry.core.masonry.api"
